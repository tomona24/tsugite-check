<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#263645"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/icon-192.png"></head><body>
<title>継手チェックシート</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* 現場の片手操作を前提にした縦1列。鋳鉄管の青灰を地に、現場マーキングの黄色を操作色に */
:root{
  --bg:#e9edf0; --surface:#ffffff; --sunk:#f3f5f7; --ink:#14202b; --muted:#566673; --line:#c9d2d9;
  --iron:#263645; --iron-ink:#eef3f6; --sel:#263645; --sel-ink:#eef3f6; --accent:#f2b705; --accent-ink:#1d1600; --accent-soft:#fff3c4;
  --ok:#1d7f46; --ok-soft:#dff3e6; --ng:#c0292b; --ng-soft:#fbe3e3; --warn:#9a5b00; --warn-soft:#fff0d6;
  --font:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --r:10px; --tap:52px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151a; --surface:#18212a; --sunk:#131b22; --ink:#e7edf1; --muted:#9aabb8; --line:#2d3a45;
  --iron:#1f2c38; --iron-ink:#e7edf1; --sel:#d3dee6; --sel-ink:#0f151a; --accent:#f5c228; --accent-ink:#1d1600; --accent-soft:#3a3010;
  --ok:#45c47e; --ok-soft:#14301f; --ng:#ff7070; --ng-soft:#3a1717; --warn:#f0a640; --warn-soft:#352711; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151a; --surface:#18212a; --sunk:#131b22; --ink:#e7edf1; --muted:#9aabb8; --line:#2d3a45;
  --iron:#1f2c38; --iron-ink:#e7edf1; --sel:#d3dee6; --sel-ink:#0f151a; --accent:#f5c228; --accent-ink:#1d1600; --accent-soft:#3a3010;
  --ok:#45c47e; --ok-soft:#14301f; --ng:#ff7070; --ng-soft:#3a1717; --warn:#f0a640; --warn-soft:#352711; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--iron)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}

.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--iron);color:var(--iron-ink)}
.appbar-in{display:flex;align-items:center;gap:10px;min-height:56px;padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto}
.appbar-t{flex:1;min-width:0}
.appbar-title{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar-sub{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center}
.iconbtn svg{width:24px;height:24px;fill:none;stroke:var(--iron-ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:active{background:rgba(255,255,255,.12)}
.brand-mark{width:28px;height:14px;border-radius:2px;background:linear-gradient(90deg,var(--iron-ink) 0 70%,var(--accent) 70% 78%,var(--iron-ink) 78%);margin-left:6px}
.sync{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid rgba(255,255,255,.3);white-space:nowrap}
.sync.is-ok{border-color:var(--ok);color:var(--iron-ink)} .sync.is-ok::before{content:"● ";color:var(--ok)}
.sync.is-sync::before{content:"◌ "} .sync.is-off::before{content:"● ";color:var(--warn)}

.wrap{max-width:760px;margin:0 auto;padding-block:18px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.wrap.has-dock{padding-bottom:120px}
.intro h1{font-size:22px;line-height:1.4}
.intro p{color:var(--muted);margin:.5em 0 0;max-width:62ch}
.row-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:6px}
.row-h h2{font-size:15px;letter-spacing:.06em;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:16px}
.note,.hint,small{color:var(--muted);font-size:13px}
.hint{margin:0}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.empty p{margin:0;color:var(--muted)}

.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns.spread{justify-content:space-between}
.btn{min-height:var(--tap);padding:0 18px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-lg{min-height:58px;font-size:17px;width:100%}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-ng{background:var(--surface);border-color:var(--ng);color:var(--ng)}
.btn-danger{background:var(--ng);border-color:var(--ng);color:#fff}
.btn-danger-q{border-color:transparent;background:transparent;color:var(--ng)}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:6px;font-size:14px}

.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.card{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.card:active{background:var(--sunk)}
.card-t{font-weight:700;font-size:16px}
.card-m{color:var(--muted);font-size:13px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.st-ok{background:var(--ok-soft);color:var(--ok)} .st-ng{background:var(--ng-soft);color:var(--ng)}
.st-todo{background:var(--sunk);color:var(--muted);border-color:var(--line)} .st-prog{background:var(--accent-soft);color:var(--ink)} .st-none{color:var(--muted)}

.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>span{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.f input,.f select,.f textarea{min-height:var(--tap);border:1.5px solid var(--line);border-radius:var(--r);background:var(--sunk);padding:10px 12px;font-size:17px;width:100%}
.f textarea{min-height:76px;resize:vertical}
.f-s{max-width:160px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;font-size:15px}
.chk input{width:22px;height:22px;accent-color:var(--sel)}
.more summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
.more[open]{display:flex;flex-direction:column;gap:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:48px;padding:6px 12px;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);font-weight:700;font-size:14px}
.seg button.on{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.seg button[disabled]{opacity:.4;text-decoration:line-through}
.seg-v{flex-direction:column}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.hist{display:grid;gap:6px;margin-top:-6px}
.hchip{display:inline-flex;align-items:stretch;max-width:100%;border:1px solid var(--line);border-radius:99px;background:var(--surface);overflow:hidden}
.hchip-n{min-height:40px;padding:4px 6px 4px 14px;border:0;background:transparent;font-size:14px;max-width:calc(100vw - 120px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hchip-x{min-width:40px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--muted);font-size:18px}
.hchip-x:active{background:var(--ng-soft);color:var(--ng)}
.hist-l{font-size:12px;color:var(--muted);font-weight:700}
.skvar{grid-template-columns:repeat(2,1fr)!important;max-height:none!important}
.skgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:380px;overflow-y:auto;padding:2px}
.sktabs button{min-height:40px}
.skb i{font-style:normal;font-size:10px;color:#8a6d00;margin-left:3px}
.sk-cur{color:var(--ink)}
.skb{display:grid;gap:2px;justify-items:center;padding:6px 4px;border:2px solid var(--line);border-radius:var(--r);background:#fff;color:#111;min-height:72px;font-size:12px;font-weight:700}
.skb.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.skb img{width:100%;max-width:120px;height:56px;object-fit:contain}
.skb span{line-height:1.3}
.skb.add{background:var(--surface);color:var(--ink);align-content:center}
.skb.add b{font-size:24px}
.sk-prev{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:6px}
.sk-prev img{display:block;width:100%;max-width:360px;margin:0 auto}
.pipe-sk{display:grid;grid-template-columns:minmax(0,260px) auto;align-items:center;gap:8px;margin-top:4px}
.pipe-sk img{max-width:100%;max-height:64px;width:auto;justify-self:start;background:#fff;border-radius:6px}.pipe-sk img.tall{max-height:120px}
.pipe-sk span{font-size:12px;color:var(--muted)}
.sk-miss{font-size:12px;color:var(--muted)}
.sklist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sklist li{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:8px}
.sklist img{width:96px;background:#fff;border:1px solid var(--line);border-radius:6px}
.chipb.on{border-color:var(--accent);background:var(--accent-soft)}
.chipb{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:40px;padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px}

.confirm{border:2px solid var(--ng);border-radius:var(--r);padding:14px;background:var(--ng-soft)}
.confirm p{margin:0 0 10px}

.sum{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sum div{display:grid;min-width:0} .sum span{color:var(--muted);font-size:13px}
.dir-note{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin:0}
.dir-note svg{width:60px;height:10px;fill:none;stroke:var(--muted);stroke-width:1.5}

.run{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pipe{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px 6px}
.pipe-h{display:flex;gap:10px;align-items:baseline}
.pipe-len{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}.pipe-len .numf{max-width:220px}.warn-t{color:var(--warn);font-size:12px;font-weight:700}
.pipe-no{font-weight:700;font-size:13px;color:var(--muted)}
.pipe-l{font-weight:700;flex:1;min-width:0}
.pipe-m{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.runs{flex-wrap:nowrap;overflow-x:auto}
.runs button{flex:0 0 auto}
.more>summary h2{display:inline;font-size:16px}
details.panel>summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:32px}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::after{content:'開く';font-size:13px;color:var(--muted);text-decoration:underline}
details.panel[open]>summary::after{content:'閉じる'}
details.panel:not([open]){gap:0}
.pipe-svg{display:block;width:100%;max-width:360px;height:auto}
.p-body{fill:var(--sunk);stroke:var(--ink);stroke-width:1.4}
.p-bell{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
.p-tip{fill:var(--accent);stroke:var(--ink);stroke-width:1}
.p-flg{fill:var(--ink);stroke:none}
.card-row{position:relative}.card-row .card{padding-right:64px}.del-x{position:absolute;right:12px;top:12px;color:var(--ng);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.branch-row{margin-top:8px}.branch-form{margin-top:10px;padding:12px;border:1px dashed var(--line,#c9d2d9);border-radius:10px}.br-note{font-size:13px;color:var(--muted);margin:4px 0 0}
.banner{display:grid;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);border-left:5px solid var(--accent)}.banner p{margin:0;font-size:14px;font-weight:700}
.imp-sum .imp-n{margin:0;font-weight:700;font-size:16px}.imp-sum ul{margin:0;padding-left:1.2em}.pack-state{margin:0;font-weight:700}
#upd{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:10px;align-items:center;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--sel);color:var(--sel-ink);font-weight:700;font-size:14px}#upd .btn{min-height:40px;color:var(--ink)}
.p-lab{font-size:11px;fill:var(--muted);font-family:var(--font)}
.joint{position:relative;padding:6px 0 6px 22px}
.joint::before{content:"";position:absolute;left:10px;top:0;bottom:0;border-left:3px dotted var(--line)}
.joint-b{width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:var(--tap);text-align:left;background:var(--sunk);border:1.5px solid var(--line);border-radius:var(--r);padding:8px 10px 8px 14px}
.joint-no{font-weight:700}
.joint-s{flex:1 1 140px;color:var(--muted);font-size:13px;min-width:0}
.chev{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-in{max-width:760px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px}
.dock-in .btn{flex:1}
.dock-in.two .btn:first-child:not(:only-child){flex:0 0 auto}
.dock-in .btn{padding:0 12px}

.steps{list-style:none;margin:0;padding:0;display:flex;gap:6px}
.steps li{flex:1;font-size:12px;font-weight:700;color:var(--muted);border-top:4px solid var(--line);padding-top:6px}
.steps li.on{color:var(--ink);border-color:var(--accent)} .steps li.done{border-color:var(--sel)}
.q{font-size:21px;line-height:1.4}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:grid;gap:4px;justify-items:center;padding:12px 8px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);min-height:96px}
.choice b{font-size:16px} .choice .pipe-svg{max-width:120px}
.choice.on,.orient.on{border-color:var(--accent);background:var(--accent-soft)}
.orients{display:flex;flex-direction:column;gap:10px}
.orient{display:grid;gap:2px;padding:10px 12px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left}
.orient span{font-weight:700}
.orient[disabled]{opacity:.4}
.prevend{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.prevend .pipe-svg{max-width:200px;opacity:.7}
.verdict{display:grid;gap:4px;padding:14px;border-radius:var(--r);background:var(--sunk);border:1px solid var(--line)}
.verdict b{font-size:17px} .verdict span{font-size:13px;color:var(--muted)}
.verdict.v-ok{background:var(--ok-soft);border-color:var(--ok)} .verdict.v-ng{background:var(--ng-soft);border-color:var(--ng)}
.eyebrow{font-size:11px !important;letter-spacing:.12em;font-weight:700;color:var(--muted)}
.warn{margin:0;padding:10px 12px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-weight:700;border-left:5px solid var(--warn)}

.chk-head{display:grid;gap:8px}
.chk-meta{display:grid} .chk-meta span{color:var(--muted);font-size:13px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.prog-t{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:700}
.item{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px}
.help{margin:0;color:var(--muted);max-width:62ch}
.ref{margin:0;font-size:14px;font-weight:700;padding:6px 10px;background:var(--sunk);border-radius:8px;border:1px dashed var(--line)}
.okng{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.okng button{min-height:76px;font-size:24px;font-weight:700;border-radius:var(--r);border:2px solid var(--line);background:var(--surface)}
.okng .ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.okng .ng{color:var(--ng)} .okng .ng.on{background:var(--ng);border-color:var(--ng);color:#fff}
.okng button.on:not(.ok):not(.ng){background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.okng.okna{grid-template-columns:1fr 1fr 1fr}
.okng.sm{grid-auto-flow:column;grid-template-columns:none}
.okng.sm button{min-height:52px;font-size:18px}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nums.n1{grid-template-columns:1fr}
.nums.n8{grid-template-columns:repeat(4,1fr)}
.numf{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px;border:2px solid var(--line);border-radius:var(--r);background:var(--sunk);padding:4px 10px;min-width:0}
.numf:focus-within{border-color:var(--accent)}
.numf span{font-weight:700;font-size:16px}
.numf input{border:0;background:transparent;font-size:24px;font-weight:700;min-height:52px;width:100%;min-width:0;text-align:right;outline:none}
.numf em{font-style:normal;color:var(--muted);font-size:13px}
.nums.n8 .numf{grid-template-columns:1fr;justify-items:stretch;padding:4px 6px;text-align:center}
.nums.n8 .numf input{text-align:center;font-size:20px;min-height:44px}
.nums.n8 .numf em{display:none}
.multi{display:flex;flex-direction:column;gap:8px}
.multi-r{display:grid;grid-template-columns:36px 1fr;align-items:center;gap:8px}
.multi-r>span{font-size:20px;font-weight:700}
.lst h3{font-size:14px;margin-bottom:4px} .lst ul{margin:0;padding-left:1.2em} .lst-ng{color:var(--ng)}
.ilist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ilist-b{width:100%;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-height:var(--tap)}
.ilist-n{font-weight:700;color:var(--muted);text-align:center}
.ilist-t{min-width:0}

.rule{gap:8px}
.rule-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rule-h h3{font-size:15px}
.rtab{overflow-x:auto}
.rtab table{border-collapse:collapse;font-size:14px}
.rtab th{font-size:12px;color:var(--muted);text-align:left;padding:4px 6px;white-space:nowrap}
.rtab td{padding:3px;white-space:nowrap}
.rtab input{width:76px;min-height:40px;border:1.5px solid var(--line);border-radius:8px;background:var(--sunk);padding:4px 8px;font-size:16px;text-align:right}
.btn-sm{min-height:40px;font-size:14px;padding:0 12px}
.rnum input{font-size:20px;min-height:44px}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.files li{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--sunk)}
.files li div{display:grid;min-width:0}

  it.check = (v, c) => {
    if (!v || v.na) return null;
    if (it.bLessC) { const cc = c.ans.c; if (!isNum(cc)) return null; const bad = (v.v || []).map((x, i) => [x, i]).filter(([x]) => isNum(x) && +x >= +cc); return bad.length ? `b が最大寸法 c（${cc}mm）以上です（${bad.map(([x, i]) => POS8[i] + ' ' + x).join('、')}）` : null; }
    const r = it.range && it.range(c); return r ? rangeWarn(v.v || [], r[0], r[1], 'b寸法') : null;
  };
}

/* ---------- 継手の解析 ---------- */
function jointInfo(section, idx) {
  const P = section.pipes[idx - 1], N = section.pipes[idx], j = N && N.joint;
  if (!P || !j) return null;
  const valid = (P.front === 'F' || N.back === 'F') ? (P.front === 'F' && N.back === 'F') : P.front !== N.back;
  const sock = P.front === '受' ? P : N, spg = sock === P ? N : P;
  const dn = +(N.dn || P.dn || section.dn), f = j.form;
  const sk = sock.kind, gk = spg.kind;
  let sheetKey, spigot = gk === 'fitting' ? 'fitting' : gk === 'cut' ? 'cut' : 'straight';
  if (f === 'GX' || f === 'NSE') {
    const p = f === 'GX' ? 'GX' : 'NSE';
    sheetKey = p + (sk === 'fitting' ? 'F' : sk === 'tsugiwa' ? 'T' : 'S');
    if (gk === 'cut') spigot = j.cutEnd || 'ring';
  } else if (f === 'NS') {
    if (dn >= 500) sheetKey = sk === 'tsugiwa' ? 'NSLT' : (sk === 'fitting' || j.liner) ? 'NSLF' : 'NSLS';
    else sheetKey = sk === 'tsugiwa' ? 'NST' : dn <= 250 ? 'NS1' : 'NS2';
  } else if (f === 'S50') sheetKey = sk === 'tsugiwa' ? 'S50T' : (sk === 'fitting' || gk === 'cut') ? 'S50F' : 'S50S';
  else if (f === 'S') sheetKey = 'S';
  else if (f === 'K') sheetKey = 'K';

/* ---------- 端末内の保管庫（IndexedDB）: 様式パック・差し替えた様式・取り込み前のバックアップ ---------- */
const TPL_DB = 'jointcheck-tpl';
function idb() { return new Promise((res, rej) => { try { const r = indexedDB.open(TPL_DB, 2); r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains('tpl')) db.createObjectStore('tpl'); if (!db.objectStoreNames.contains('bak')) db.createObjectStore('bak'); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked')); } catch (e) { rej(e); } }); }
async function dbGet(store, k) { try { const db = await idb(); return await new Promise(res => { const q = db.transaction(store).objectStore(store).get(k); q.onsuccess = () => res(q.result === undefined ? null : q.result); q.onerror = () => res(null); }); } catch (e) { return null; } }
async function dbKeys(store) { try { const db = await idb(); return await new Promise(res => { const q = db.transaction(store).objectStore(store).getAllKeys(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); }); } catch (e) { return []; } }
async function dbPut(store, k, v) { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction(store, 'readwrite'); v === null ? t.objectStore(store).delete(k) : t.objectStore(store).put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); }
const tplGet = f => dbGet('tpl', f), tplPut = (f, v) => dbPut('tpl', f, v);
/* 様式（Excel）の所在: 差し替えたファイル → 様式パック → 埋め込み（プレビュー版のみ）
   tpl.state: 'ok'（パックあり）| 'embedded'（埋め込みあり）| 'none'（未読込）| 'unknown'（確認前） */
const tpl = { state: 'unknown', version: '', at: '', missing: [] };
const embeddedTpl = f => { const el = document.getElementById('tpl-' + f); return el ? el.textContent.trim() : ''; };
async function tplCheck() {
  const m = await dbGet('tpl', 'pack');
  if (m && m.version) { tpl.version = m.version; tpl.at = m.at || ''; const miss = []; for (const f of Object.keys(E.FAMILY_FILES)) if (!(await dbGet('tpl', 'pack:' + f))) miss.push(f); tpl.missing = miss; tpl.state = miss.length === Object.keys(E.FAMILY_FILES).length ? 'none' : 'ok'; }
  else tpl.state = embeddedTpl('GX') ? 'embedded' : 'none';
}
async function tplBytes(f) {
  const ov = await tplGet(f); if (ov && ov.data) return new Uint8Array(ov.data);
  const pk = await dbGet('tpl', 'pack:' + f); if (pk && pk.data) return new Uint8Array(pk.data);
  const emb = embeddedTpl(f); if (emb) return b64(emb);
  return null;
}
// 様式ファイルのシート名を確かめる（必要なシートが無ければその名前を返す）
async function tplCheckSheets(buf, fam) {
  const zip = await window.JSZip.loadAsync(buf);
  const wb = zip.file('xl/workbook.xml'); if (!wb) return ['（Excelファイルではありません）'];
  const wbx = await wb.async('string');
  const names = Array.from(wbx.matchAll(/<sheet [^>]*name="([^"]*)"/g)).map(m => m[1].replace(/&amp;/g, '&'));
  const need = Object.values(E.SHEETS).filter(x => x.tpl[fam]).map(x => x.tpl[fam]);
  return need.filter(n => !names.includes(n));
}
// 様式パック（.jctpl = zip: manifest.json + <形式>.xlsx）を読み込んで端末に保存する
async function loadPack(file) {
  const buf = await file.arrayBuffer();
  const zip = await window.JSZip.loadAsync(buf);
  const mf = zip.file('manifest.json'); if (!mf) throw new Error('様式パックではありません（manifest.json がありません）');
  const m = JSON.parse(await mf.async('string')); if (!m || m.format !== 'jctpl' || !m.files) throw new Error('様式パックの形式が違います');
  const got = {}, bad = [];
  for (const f of Object.keys(E.FAMILY_FILES)) {
    const ent = m.files[f] && zip.file(m.files[f]); if (!ent) { bad.push(`${E.FAMILY_FILES[f]}: ファイルなし`); continue; }
    const data = await ent.async('uint8array');
    const miss = await tplCheckSheets(data, f); if (miss.length) { bad.push(`${E.FAMILY_FILES[f]}: シート ${miss.join('、')} がありません`); continue; }
    got[f] = data;
  }
  if (bad.length) throw new Error('様式パックに不備があります。' + bad.join(' ／ '));
  for (const [f, data] of Object.entries(got)) await dbPut('tpl', 'pack:' + f, { data, at: today() });
  await dbPut('tpl', 'pack', { version: String(m.version || ''), at: today(), name: file.name });
  await tplCheck();
}
let tplInfo = {};
async function loadTplInfo() { for (const f of Object.keys(E.FAMILY_FILES)) { const v = await tplGet(f); tplInfo[f] = v ? { name: v.name, at: v.at } : null; } await tplCheck(); if (ui.view === 'rules') render(); }
/* バックアップ（取り込み・戻す前の全データ。新しい3件だけ残す） */
const BAK_KEEP = 3;
async function bakList() { const keys = (await dbKeys('bak')).map(Number).sort((a, b) => b - a); const out = []; for (const k of keys) { const v = await dbGet('bak', k); if (v) out.push({ at: k, reason: v.reason || '', n: v.n || 0 }); } return out; }
async function bakAdd(reason) {
  const at = Date.now();
  await dbPut('bak', at, { reason, n: S.sections.length, json: JSON.stringify(S) });
  const keys = (await dbKeys('bak')).map(Number).sort((a, b) => b - a);
  for (const k of keys.slice(BAK_KEEP)) await dbPut('bak', k, null);
  return at;
}
let bakInfo = null;
async function loadBakInfo() { bakInfo = await bakList(); if (ui.view === 'settings') render(); }
/* ---------- 書き出し・取り込み ---------- */
const stamp = () => { const d = new Date(); const z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}`; };
function exportJSON() {
  const data = { app: 'jointcheck', v: 2, deviceId, deviceName, exportedAt: new Date().toISOString(), projects: S.projects, sections: S.sections, sketches: S.sketches || [], rules: S.rules || {}, kojiHist: S.kojiHist || [], kojiHidden: S.kojiHidden || [] };
  const name = `継手チェック_${fname(deviceName) || '端末'}_${stamp()}.json`;
  return saveBlob(name, new Blob([JSON.stringify(data)], { type: 'application/json' })).then(r => { if (r) { xs.lastExportAt = Date.now(); xs.dirty = false; saveXs(); chip(); if (ui.view === 'home' || ui.view === 'project') render(); } return r; });
}
// vv の比較: 'eq' | 'a'（a が新しい）| 'b'（b が新しい）| 'conc'（両方で変更）
function vvCmp(a, b) {
  a = a || {}; b = b || {}; let ga = false, gb = false;
  for (const k of new Set(Object.keys(a).concat(Object.keys(b)))) { const x = a[k] || 0, y = b[k] || 0; if (x > y) ga = true; else if (y > x) gb = true; }
  return ga && gb ? 'conc' : ga ? 'a' : gb ? 'b' : 'eq';
}
const vvJoin = (a, b) => { const o = Object.assign({}, a || {}); for (const [k, n] of Object.entries(b || {})) if ((o[k] || 0) < n) o[k] = n; return o; };
const vvEmpty = v => !v || !Object.keys(v).length;
const copyAt = () => { const d = new Date(); return `（取り込み版 ${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}）`; };
/* 取り込み＝合わせる（消さない）。工事は設定だけ、チェックシートは id ごとに新旧を比べる
   同じ vv か同じ内容→そのまま／取り込む側が新しい→置き換え／端末側が新しい→端末側／両方で変更→端末側を残し、取り込む側を別名の写しで追加 */
function mergeData(d, opt) {
  const r = { add: 0, upd: 0, both: 0, same: 0, notes: [] };
  for (const ip of d.projects) {
    const lp = proj(ip.id);
    if (!lp) { S.projects.push(ip); fps.set(ip.id, projFp(ip)); r.add++; continue; }
    const same = projFp(lp) === projFp(ip);
    const c = vvEmpty(lp.vv) && vvEmpty(ip.vv) ? (same ? 'eq' : 'conc') : vvCmp(lp.vv, ip.vv);
    if (c === 'eq' || same) { if (c !== 'eq') lp.vv = vvJoin(lp.vv, ip.vv); r.same++; }
    else if (c === 'b') { ['name', 'worker', 'kTorque', 'gxMode', 'dashNA', 'updatedAt'].forEach(k => { if (ip[k] !== undefined) lp[k] = ip[k]; else delete lp[k]; }); lp.vv = ip.vv; fps.set(lp.id, projFp(lp)); r.upd++; }
    else if (c === 'a') r.same++;
    else { lp.vv = vvJoin(lp.vv, ip.vv); bump(lp); r.same++; r.notes.push(`工事「${lp.name || '（工事名未入力）'}」の設定は両方で変わっていたため、この端末の設定を残しました`); }
  }
  for (const is of d.sections) {
    const ls = sec(is.id);
    if (!ls) { S.sections.push(is); fps.set(is.id, secFp(is)); r.add++; continue; }
    const same = secFp(ls) === secFp(is);
    const c = vvEmpty(ls.vv) && vvEmpty(is.vv) ? (same ? 'eq' : 'conc') : vvCmp(ls.vv, is.vv);
    if (c === 'eq' || same) { if (c !== 'eq') ls.vv = vvJoin(ls.vv, is.vv); r.same++; }
    else if (c === 'b') { const k = S.sections.indexOf(ls); S.sections[k] = is; fps.set(is.id, secFp(is)); r.upd++; }
    else if (c === 'a') r.same++;
    else {
      // 両方で変更: 端末側を残し、取り込む側は新しい id の写しにする（以後は別のシートとして扱う）
      const cp = JSON.parse(JSON.stringify(is)); cp.id = uid(); cp.pipes.forEach(x => { x.id = uid(); }); cp.zumen = (cp.zumen || '') + copyAt(); cp.vv = {}; bump(cp);
      ls.vv = vvJoin(ls.vv, is.vv); bump(ls);
      S.sections.push(cp); fps.set(cp.id, secFp(cp)); r.both++;
      r.notes.push(`「${is.zumen || 'チェックシート'}」は両方で変わっていたため、取り込む側を「${cp.zumen}」として残しました`);
    }
  }
  if (d.sketches) { const ids = new Set((S.sketches || []).map(x => x.id)); const nw = d.sketches.filter(x => !ids.has(x.id)); if (nw.length) { S.sketches = (S.sketches || []).concat(nw); r.notes.push(`略図の画像を ${nw.length} 件追加しました`); } }
  if (d.rules && Object.keys(d.rules).length) {
    const mine = S.rules && Object.keys(S.rules).length ? JSON.stringify(S.rules) : '';
    if (!mine) { S.rules = d.rules; E.setRules(S.rules); r.notes.push('判定基準の変更を取り込みました'); }
    else if (mine === JSON.stringify(d.rules)) {}
    else if (opt.confirmRules()) { S.rules = d.rules; E.setRules(S.rules); r.notes.push('判定基準を取り込んだ内容に置き換えました'); }
    else r.notes.push('判定基準はこの端末の値を残しました');
  }
  if (d.kojiHist) S.kojiHist = Array.from(new Set((S.kojiHist || []).concat(d.kojiHist))).slice(0, 30);
  if (d.kojiHidden) S.kojiHidden = Array.from(new Set((S.kojiHidden || []).concat(d.kojiHidden)));
  return r;
}
async function importJSON(file) {
  let raw;
  try { raw = JSON.parse(await file.text()); } catch (e) { toast('ファイルを読み込めませんでした'); return; }
  if (!raw || !Array.isArray(raw.projects) || !Array.isArray(raw.sections)) { toast('継手チェックの書き出しファイルではありません'); return; }
  const { data: d, dropped } = normData(raw);   // 形の合わない要素は取り込まない
  try { await bakAdd('取り込み前'); } catch (e) { toast('取り込み前のバックアップを作れなかったため、取り込みを中止しました'); return; }
  const r = mergeData(d, { confirmRules: () => window.confirm('判定基準がこの端末でも変更されています。取り込んだファイルの判定基準に置き換えますか？') });
  if (dropped) r.notes.push(`壊れた ${dropped} 件は読み飛ばしました`);
  save();
  ui.impResult = r; ui.expAsk = false;
  go({ view: 'home' });
  toast(`取り込みました（追加 ${r.add}・更新 ${r.upd}・両方残した ${r.both}・変更なし ${r.same}${dropped ? `、壊れた${dropped}件は読み飛ばしました` : ''}）`);
}
async function restoreBak(at) {
  const v = await dbGet('bak', at); if (!v) { toast('バックアップが見つかりません'); return; }
  let d; try { d = normData(JSON.parse(v.json)).data; } catch (e) { toast('バックアップを読み込めませんでした'); return; }
  try { await bakAdd('戻す前'); } catch (e) {}
  S = d; try { E.setRules(S.rules || {}); } catch (e) { S.rules = {}; }
  fps.clear(); S.projects.forEach(p => { if (vvEmpty(p.vv)) bump(p); fps.set(p.id, projFp(p)); }); S.sections.forEach(s => { if (vvEmpty(s.vv)) bump(s); fps.set(s.id, secFp(s)); });
  save(); await loadBakInfo(); go({ view: 'home' }); toast(`${fmtAt(at)} の状態に戻しました`);
}

<script>

// PWA: オフラインで動かすための service worker。新しい版が入ったら知らせ、「再読み込み」で切り替える
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  let wantReload = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (wantReload) { wantReload = false; location.reload(); } });
  const showUpd = reg => {
    if (document.getElementById('upd')) return;
    const el = document.createElement('div'); el.id = 'upd'; el.innerHTML = '<span>新しい版があります</span><button class="btn btn-sm">再読み込み</button>';
    el.querySelector('button').onclick = () => { wantReload = true; if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' }); else location.reload(); };
    document.body.appendChild(el);
  };
  navigator.serviceWorker.register('./sw.js').then(reg => {
    if (reg.waiting && navigator.serviceWorker.controller) showUpd(reg);
    reg.addEventListener('updatefound', () => { const w = reg.installing; if (!w) return; w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpd(reg); }); });
  }).catch(() => {});
}

</script>
